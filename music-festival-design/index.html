<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fun Fun Fun Fest Branding by Risako Fujinuma">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/png" href="../assets/favicon/R_icon-02.png">
    <title>Fun Fun Fun Fest Branding | Risako Fujinuma</title>
    <style>
        .project-hero {
            padding-top: calc(var(--header-height) + 2rem);
        }

        .project-hero-img {
            width: 100%;
            height: auto;
            display: block;
        }

        .project-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            padding: 2rem 20px;
            max-width: 100%;
            align-items: start;
        }

        .project-info-text {
            padding-right: 2rem;
        }

        .project-title {
            font-size: var(--h1-font-size);
            color: var(--title-color);
            margin-bottom: 1.5rem;
            line-height: 1.3;
        }

        .project-description {
            font-size: 20px;
            line-height: 1.8;
            color: var(--text-color);
        }

        .project-info-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        .project-gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px;
            padding: 4px 20px 0 20px;
        }

        .project-gallery-item {
            width: 100%;
            height: auto;
            display: block;
        }

        .project-gallery-span2 {
            display: grid;
            grid-template-columns: 1fr;
            gap: 4px;
            padding: 4px 20px 0 20px;
        }

        .project-gallery-span2 img {
            width: 100%;
            height: auto;
            display: block;
        }

        .project-gallery-2row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
            gap: 4px;
            padding: 4px 20px 0 20px;
        }

        .project-gallery-2row .span-2-rows {
            grid-row: 1 / 3;
            grid-column: 2;
        }

        .project-gallery-2row img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* Responsive */
        @media screen and (max-width: 768px) {
            .project-info {
                grid-template-columns: 1fr;
                padding-top: calc(var(--header-height) + 2rem);
            }

            .project-info-text {
                padding-right: 0;
            }

            .project-gallery {
                grid-template-columns: 1fr;
            }

            .project-gallery-2row {
                grid-template-columns: 1fr;
            }

            .project-gallery-2row .span-2-rows {
                grid-row: auto;
                grid-column: auto;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header" id="header">
        <nav class="nav container">
            <a href="/" class="nav-logo">Risako Fujinuma</a>
            <div class="nav-menu" id="nav-menu">
                <ul class="nav-list">
                    <li class="nav-item">
                        <a href="/" class="nav-link">WORK</a>
                    </li>
                    <li class="nav-item">
                        <a href="/about/" class="nav-link">ABOUT</a>
                    </li>
                </ul>
            </div>
            <div class="nav-toggle" id="nav-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <!-- Main -->
    <main class="main">
        <!-- Hero Image -->
        <section class="project-hero">
            <img src="../assets/images/Music%20Festival%20Branding/musicfes2.jpg" alt="Fun Fun Fun Fest Stage" class="project-hero-img">
        </section>

        <!-- Row 1: Text + T-shirts -->
        <section class="project-info">
            <div class="project-info-text">
                <h1 class="project-title">Fun Fun Fun Fest Branding</h1>
                <p class="project-description">
                    I created two types of pixel letters using letterpress printing. I aimed to convey the smooth of something handmade to people of all ages and genders, choosing unusual colors like yellow, blue, orange, and green.
                </p>
            </div>
            <div class="project-info-image">
                <img src="../assets/images/Music%20Festival%20Branding/tshirts_on_hangers2.jpg" alt="Fun Fun Fun Fest T-shirts">
            </div>
        </section>

        <!-- Row 2: Banners + FFF Logo -->
        <section class="project-gallery">
            <img src="../assets/images/Music%20Festival%20Branding/musicfes1.jpg" alt="Festival Banners" class="project-gallery-item">
            <img src="../assets/images/Music%20Festival%20Branding/musicfes4.png" alt="FFF Logo" class="project-gallery-item">
        </section>

        <!-- Row 3-4: Poster + Tickets on left, Lanyards spanning 2 rows on right -->
        <section class="project-gallery-2row">
            <img src="../assets/images/Music%20Festival%20Branding/musicfes3.jpg" alt="Festival Poster">
            <img src="../assets/images/Music%20Festival%20Branding/musicfes6.jpg" alt="Festival Lanyards and Badges" class="span-2-rows">
            <img src="../assets/images/Music%20Festival%20Branding/musicfes5.jpg" alt="Festival Tickets">
        </section>

        <!-- Row 5: T-shirts hanging -->
        <section class="project-gallery-span2">
            <img src="../assets/images/Music%20Festival%20Branding/musicfes7.jpg" alt="Festival T-shirts">
        </section>

        <!-- Row 6: Skateboard + Bucket Hat -->
        <section class="project-gallery">
            <img src="../assets/images/Music%20Festival%20Branding/musicfes8.jpg" alt="Festival Skateboard" class="project-gallery-item">
            <img src="../assets/images/Music%20Festival%20Branding/musicfes9.png" alt="Festival Bucket Hat" class="project-gallery-item">
        </section>

        <!-- Row 7: Direction Signs -->
        <section class="project-gallery-span2">
            <img src="../assets/images/Music%20Festival%20Branding/musicfes10.jpg" alt="Festival Direction Signs">
        </section>
    </main>

    <script src="../js/main.js"></script>
</body>
</html>
