<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kinetic Typography by Risako Fujinuma">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/png" href="../assets/favicon/R_icon-02.png">
    <title>Kinetic Typography | Risako Fujinuma</title>
    <style>
        .project-hero {
            padding-top: calc(var(--header-height) + 2rem);
        }

        .project-hero-video {
            width: 100%;
            height: auto;
            display: block;
        }

        .project-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            padding: 2rem 20px;
            max-width: 100%;
            align-items: start;
        }

        .project-info-text {
            padding-right: 2rem;
        }

        .project-title {
            font-size: var(--h1-font-size);
            color: var(--title-color);
            margin-bottom: 1.5rem;
            line-height: 1.3;
        }

        .project-description {
            font-size: 20px;
            line-height: 1.8;
            color: var(--text-color);
        }

        .project-info-video video {
            width: 100%;
            height: auto;
            display: block;
        }

        .project-gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px;
            padding: 4px 20px 0 20px;
        }

        .project-gallery-item {
            width: 100%;
            height: auto;
            display: block;
        }

        .project-gallery-full {
            padding: 4px 20px 0 20px;
        }

        .project-gallery-full img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Responsive */
        @media screen and (max-width: 768px) {
            .project-info {
                grid-template-columns: 1fr;
                padding-top: calc(var(--header-height) + 2rem);
            }

            .project-info-text {
                padding-right: 0;
            }

            .project-gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header" id="header">
        <nav class="nav container">
            <a href="/" class="nav-logo">Risako Fujinuma</a>
            <div class="nav-menu" id="nav-menu">
                <ul class="nav-list">
                    <li class="nav-item">
                        <a href="/" class="nav-link">WORK</a>
                    </li>
                    <li class="nav-item">
                        <a href="/about/" class="nav-link">ABOUT</a>
                    </li>
                </ul>
            </div>
            <div class="nav-toggle" id="nav-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <!-- Main -->
    <main class="main">
        <!-- Hero Video -->
        <section class="project-hero">
            <video class="project-hero-video" autoplay loop muted playsinline>
                <source src="../assets/images/KineticTypography/KineticType.mp4" type="video/mp4">
            </video>
        </section>

        <!-- Row 1: Text + Video 2 -->
        <section class="project-info">
            <div class="project-info-text">
                <h1 class="project-title">Kinetic Typography</h1>
                <p class="project-description">
                    A motion design exploration using kinetic typography. Letters and words come alive through movement, rhythm, and visual expression, transforming static text into a dynamic experience.
                </p>
            </div>
            <div class="project-info-video">
                <video autoplay loop muted playsinline>
                    <source src="../assets/images/KineticTypography/KineticType1.mp4" type="video/mp4">
                </video>
            </div>
        </section>

        <!-- Row 2: KineticType2 + KineticType3 -->
        <section class="project-gallery">
            <img src="../assets/images/KineticTypography/KineticType2.jpg" alt="Kinetic Typography Frame 1" class="project-gallery-item">
            <img src="../assets/images/KineticTypography/KineticType3.jpg" alt="Kinetic Typography Frame 2" class="project-gallery-item">
        </section>

        <!-- Row 3: KineticType4 + KineticType5 -->
        <section class="project-gallery">
            <img src="../assets/images/KineticTypography/KineticType4.jpg" alt="Kinetic Typography Frame 3" class="project-gallery-item">
            <img src="../assets/images/KineticTypography/KineticType5.jpg" alt="Kinetic Typography Frame 4" class="project-gallery-item">
        </section>

        <!-- Row 4: KineticType6 full width -->
        <section class="project-gallery-full">
            <img src="../assets/images/KineticTypography/KineticType6.jpg" alt="Kinetic Typography Frame 5">
        </section>
    </main>

    <script src="../js/main.js"></script>
</body>
</html>
