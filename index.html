<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Professional portfolio for Risako Fujinuma">
    <meta name="keywords" content="Graphic Design, Package Design, Branding, Typography, Risako Fujinuma, Portfolio">
    <meta name="author" content="Risako Fujinuma">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
    <title>Risako Fujinuma | Portfolio</title>
</head>

<body>
    <!-- Header -->
    <header class="header" id="header">
        <nav class="nav container">
            <a href="/" class="nav-logo">Risako Fujinuma</a>
            <div class="nav-menu" id="nav-menu">
                <ul class="nav-list">
                    <li class="nav-item">
                        <a href="#work" class="nav-link active">WORK</a>
                    </li>
                    <li class="nav-item">
                        <a href="/about/" class="nav-link">ABOUT</a>
                    </li>
                </ul>
            </div>
            <div class="nav-toggle" id="nav-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <!-- Main -->
    <main class="main">
        <!-- Hero section -->
        <section class="hero section" id="home">
            <div class="hero-container">
                <p class="hero-description">
                    Risako Fujinuma is a New York-based graphic designer specializing<br>
                    in brand systems, print, packaging and typeface.
                </p>
            </div>
        </section>

        <!-- Work section -->
        <section class="work section" id="work">
            <div class="work-container">
                <div class="work-grid">
                    <!-- Row 1 -->
                    <a href="package-design/" class="work-item">
                        <img src="assets/images/oliveoil/package1-1.jpg" alt="Olive Oil & Balsamic Package" class="work-img">
                    </a>
                    <a href="#" class="work-item">
                        <img src="img/newsletter_cover.jpg" alt="LargeHearted Boy Newsletter Design" class="work-img">
                    </a>

                    <!-- Row 2 -->
                    <a href="#" class="work-item">
                        <img src="img/musicfes.jpg" alt="Music Festival Design" class="work-img">
                    </a>
                    <a href="package-design/" class="work-item">
                        <img src="assets/images/pastabox/pastabox2.jpg" alt="De Cecco Pasta Box Design" class="work-img">
                    </a>

                    <!-- Row 3 -->
                    <a href="#" class="work-item">
                        <img src="assets/images/Cemetery/CEMETERY1.jpg" alt="Cemetery Design" class="work-img">
                    </a>
                </div>
            </div>
        </section>

    </main>

    <script src="js/main.js"></script>
</body>
</html>
