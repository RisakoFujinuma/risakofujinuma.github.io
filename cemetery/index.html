<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cemetery by Risako Fujinuma">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/png" href="../assets/favicon/R_icon-02.png">
    <title>Cemetery | Risako Fujinuma</title>
    <style>
        .project-hero {
            padding-top: calc(var(--header-height) + 2rem);
        }

        .project-hero-img {
            width: 100%;
            height: auto;
            display: block;
        }

        .project-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            padding: 2rem 20px;
            max-width: 100%;
            align-items: start;
        }

        .project-info-text {
            padding-right: 2rem;
        }

        .project-title {
            font-size: var(--h1-font-size);
            color: var(--title-color);
            margin-bottom: 1.5rem;
            line-height: 1.3;
        }

        .project-description {
            font-size: 20px;
            line-height: 1.8;
            color: var(--text-color);
        }

        .project-info-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        .project-gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px;
            padding: 4px 20px 0 20px;
        }

        .project-gallery-item {
            width: 100%;
            height: auto;
            display: block;
        }

        .project-gallery-span2 {
            display: grid;
            grid-template-columns: 1fr;
            gap: 4px;
            padding: 4px 20px 0 20px;
        }

        .project-gallery-span2 img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Responsive */
        @media screen and (max-width: 768px) {
            .project-info {
                grid-template-columns: 1fr;
                padding-top: calc(var(--header-height) + 2rem);
            }

            .project-info-text {
                padding-right: 0;
            }

            .project-gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header" id="header">
        <nav class="nav container">
            <a href="/" class="nav-logo">Risako Fujinuma</a>
            <div class="nav-menu" id="nav-menu">
                <ul class="nav-list">
                    <li class="nav-item">
                        <a href="/" class="nav-link">WORK</a>
                    </li>
                    <li class="nav-item">
                        <a href="/about/" class="nav-link">ABOUT</a>
                    </li>
                </ul>
            </div>
            <div class="nav-toggle" id="nav-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <!-- Main -->
    <main class="main">
        <!-- Hero Image -->
        <section class="project-hero">
            <img src="../assets/images/Cemetery/CEMETERY1.jpg" alt="Cemetery" class="project-hero-img">
        </section>

        <!-- Row 1: Text + Image -->
        <section class="project-info">
            <div class="project-info-text">
                <h1 class="project-title">Cemetery</h1>
                <p class="project-description">
                    'Cemetery' is a custom typeface with long, pointed serifs and elegant scrollwork, with a consistent visual style across uppercase and lowercase letters, basic punctuation, and select dingbats.
                </p>
            </div>
            <div class="project-info-image">
                <img src="../assets/images/Cemetery/cemetery2.jpg" alt="Cemetery Gate Design">
            </div>
        </section>

        <!-- Row 3: Half width left aligned -->
        <section class="project-gallery-span2">
            <img src="../assets/images/Cemetery/Risako_Fujinuma_CEMETERY5.jpg" alt="Cemetery 5" style="width: 50%;">
        </section>

        <!-- Row 4: Full width -->
        <section class="project-gallery-span2">
            <img src="../assets/images/Cemetery/Risako_Fujinuma_CEMETERY3.jpg" alt="Cemetery 3">
        </section>

        <!-- Row 5: Half width right aligned -->
        <section class="project-gallery-span2" style="display: flex; justify-content: flex-end;">
            <img src="../assets/images/Cemetery/Risako_Fujinuma_CEMETERY4.jpg" alt="Cemetery 4" style="width: 50%;">
        </section>
    </main>

    <script src="../js/main.js"></script>
</body>
</html>
